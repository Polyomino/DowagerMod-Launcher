name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      # MSVC build: single self-contained exe, no MinGW DLLs needed.
      - run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes "target/release/dowager-mod-launcher.exe"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
