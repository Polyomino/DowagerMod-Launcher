[package]
name = "dowager-mod-launcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Desktop launcher for DowagerMod (Civ4: Beyond the Sword): branch status, one-click update, branch switching, game launch"
license = "MIT"

[[bin]]
name = "dowager-mod-launcher"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
open = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
